name: assemble

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/part-*.txt'
      - '.github/workflows/assemble.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Concatenate source parts into index.html
        run: |
          set -euo pipefail
          cat src/part-*.txt > index.html
          wc -c index.html
          md5sum index.html

      - name: Verify byte-exact reproduction
        run: |
          set -euo pipefail
          expected="52dc5bcb8ea52c5e0b0101090a653690"
          actual="$(md5sum index.html | cut -d' ' -f1)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
          test "$(wc -c < index.html)" -eq 64472

      - name: Commit index.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "build: index.html (parcalardan birlestirildi, md5 dogrulandi)"
            git push
          fi
